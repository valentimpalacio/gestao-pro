version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gestao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao_negocios
      MYSQL_USER: gestao_user
      MYSQL_PASSWORD: gestao_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: gestao-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: gestao_user
      DB_PASSWORD: gestao_pass
      DB_NAME: gestao_negocios
      JWT_SECRET: sua_chave_secreta_super_segura_aqui_min_32_chars
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm run setup && npm run dev"

  frontend:
    build: ./frontend
    container_name: gestao-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  mysql_data:
