services:
  - type: web
    name: gestao-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: gestao-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestao-mysql
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gestao-mysql
          property: database
      - key: DB_USER
        fromDatabase:
          name: gestao-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestao-mysql
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://seu-frontend.vercel.app

databases:
  - name: gestao-mysql
    databaseName: gestao_negocios
    user: gestao_user
    plan: free
